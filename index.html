<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shivakashi Crackers – Order Online</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--night:#14173f;--card:#faf8ff;--pink:#d3226b;--gold:#f4b000;--green:#12805c;--ink:#241f3d;--mute:#6d688a;--line:#e3ddf0}
*{box-sizing:border-box}
body{margin:0;background:#fff;color:var(--ink);font-family:Figtree,system-ui,sans-serif;line-height:1.45}
h1,h2,h3{font-family:"Bricolage Grotesque",Figtree,sans-serif;margin:0}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.banner{display:block;width:100%;height:auto}
.wrap{max-width:1100px;margin:0 auto;padding:0 14px}
main{padding-bottom:120px}
.tools{display:flex;gap:10px;align-items:center;margin:4px 0 14px}
.tools input{flex:1;padding:11px 14px;border:1px solid var(--line);border-radius:10px;font:inherit}
.tools span{color:var(--mute);font-size:14px;white-space:nowrap}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px}
.p{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.p.gone{display:none}
.ph{display:block;width:100%;aspect-ratio:3/4;background:#ddd;border:0;padding:0;cursor:zoom-in}
.ph img{display:block;width:100%;height:100%;object-fit:cover}
.pb{padding:10px;display:flex;flex-direction:column;gap:6px;flex:1}
.pb h3{font-size:15px;line-height:1.25;min-height:2.5em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pb small{color:var(--mute);min-height:1.3em;display:block}
.price{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;min-height:30px}
.new{font-family:"Bricolage Grotesque",sans-serif;font-size:21px;font-weight:800;color:var(--pink)}
.old{text-decoration:line-through;color:var(--mute);font-size:14px}
.off{background:#e7f6ef;color:var(--green);font-size:12px;font-weight:700;padding:1px 7px;border-radius:99px}
.nop{color:var(--mute);font-size:14px}
.qty{display:flex;margin-top:auto}
.qty button{width:38px;height:38px;border:1px solid var(--line);background:#fff;font-size:20px;cursor:pointer;color:var(--ink)}
.qty button:first-child{border-radius:10px 0 0 10px}.qty button:last-child{border-radius:0 10px 10px 0}
.qty input{flex:1;min-width:0;height:38px;text-align:center;border:1px solid var(--line);border-left:0;border-right:0;font:inherit;font-weight:600}
.qty.off button,.qty.off input{opacity:.4;pointer-events:none}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 0;padding-bottom:max(10px,env(safe-area-inset-bottom))}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
.btn{background:var(--pink);color:#fff;border:0;border-radius:10px;padding:12px 22px;font:inherit;font-weight:700;cursor:pointer}
.btn:disabled{background:#c9c3dc;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 6px;border-bottom:1px solid var(--line);font-size:15px}
th{color:var(--mute);font-weight:600}
.r{text-align:right}
.tot td{border:0;font-weight:700}
.save{color:var(--green)}
label{display:block;font-weight:600;margin:12px 0 4px}
.f{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit}
.err{color:#b3261e;font-size:14px;margin-top:8px;min-height:20px}
.note{font-size:13px;color:var(--mute);margin-top:10px}
.hide{display:none!important}
.ok{text-align:center;padding:36px 10px}
.lb{position:fixed;inset:0;background:rgba(10,10,30,.85);display:flex;align-items:center;justify-content:center;z-index:9;padding:16px}
.lb img{max-width:100%;max-height:100%;border-radius:10px}
.pad{padding-top:18px}
</style>
</head>
<body>
<h1 class="vh">Shivakashi Crackers</h1>
<img class="banner" src="banner.jpg" alt="Shivakashi Crackers">

<main class="wrap">
  <!-- Page 1: products -->
  <section id="shop">
    <div class="tools">
      <input id="search" type="search" placeholder="Search crackers" aria-label="Search crackers">
      <span id="shown"></span>
    </div>
    <div class="grid" id="grid"></div>
    <p class="note" id="loadErr"></p>
  </section>

  <!-- Page 2: order summary -->
  <section id="summary" class="hide pad">
    <h2 style="margin-bottom:14px">Your order</h2>
    <div class="box tw">
      <table>
        <thead><tr><th>Item</th><th class="r">Price</th><th class="r">Qty</th><th class="r">Amount</th></tr></thead>
        <tbody id="rows"></tbody>
        <tfoot id="foot"></tfoot>
      </table>
    </div>
    <div class="box">
      <h3>Delivery details</h3>
      <label for="name">Name</label>
      <input class="f" id="name" autocomplete="name">
      <label for="phone">Phone number</label>
      <input class="f" id="phone" type="tel" inputmode="numeric" maxlength="10" autocomplete="tel" placeholder="10-digit mobile number">
      <label for="addr">Address</label>
      <textarea class="f" id="addr" rows="3" autocomplete="street-address"></textarea>
      <div class="err" id="err" role="alert"></div>
      <div style="display:flex;gap:10px;margin-top:6px;flex-wrap:wrap">
        <button class="btn ghost" id="back">Edit items</button>
        <button class="btn" id="submit">Place order</button>
      </div>
      <p class="note" id="note"></p>
    </div>
  </section>

  <!-- Page 3: done -->
  <section id="done" class="hide pad">
    <div class="box ok">
      <h2>Order placed</h2>
      <p>Your order number is <strong id="oid"></strong>.<br>We will call you on <strong id="ph"></strong> to confirm.</p>
      <button class="btn" id="again">Start a new order</button>
    </div>
  </section>
</main>

<div class="bar" id="bar"><div class="wrap">
  <div><strong id="count">0 items</strong><br><span id="barTotal" style="color:var(--mute)">₹0</span></div>
  <button class="btn" id="review" disabled>Review order</button>
</div></div>

<div class="lb hide" id="lb"><img alt=""></div>

<script src="config.js"></script>
<script>
const URL_SET = typeof SHEET_URL !== "undefined" && SHEET_URL;
let PRODUCTS = [];
const cart = {};
const $ = id => document.getElementById(id);
const rs = n => "₹" + n.toLocaleString("en-IN");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const label = p => p.name || ("Item " + p.id);
const items = () => PRODUCTS.filter(p => cart[p.id] > 0);

/* ---- read products.csv (edit it in Excel / Google Sheets) ---- */
function parseCSV(t){
  t = t.replace(/^\ufeff/, "");
  const rows = []; let row = [], f = "", q = false;
  for (let i = 0; i < t.length; i++){
    const c = t[i];
    if (q){ if (c === '"'){ if (t[i+1] === '"'){ f += '"'; i++; } else q = false; } else f += c; }
    else if (c === '"') q = true;
    else if (c === ",") { row.push(f); f = ""; }
    else if (c === "\n") { row.push(f); rows.push(row); row = []; f = ""; }
    else if (c !== "\r") f += c;
  }
  if (f || row.length){ row.push(f); rows.push(row); }
  const head = rows.shift().map(h => h.trim().toLowerCase());
  return rows.filter(r => r.some(x => x.trim())).map(r => {
    const o = {}; head.forEach((h, i) => o[h] = (r[i] || "").trim());
    const price = parseFloat(o.price) || 0, mrp = parseFloat(o.mrp) || 0;
    return {id:o.id, image:o.image, name:o.name, pack:o.pack, price, mrp: mrp || price};
  });
}

async function load(){
  try{
    const r = await fetch("products.csv", {cache:"no-cache"});
    if (!r.ok) throw 0;
    PRODUCTS = parseCSV(await r.text());
    renderGrid();
  }catch(e){
    $("loadErr").textContent = "Could not load the product list. Please refresh the page.";
  }
}

function renderGrid(){
  $("grid").innerHTML = PRODUCTS.map(p => {
    const ok = p.price > 0, pct = Math.round((1 - p.price / p.mrp) * 100);
    const priceHtml = !ok ? '<span class="nop">Price coming soon</span>'
      : `<span class="new">${rs(p.price)}</span>` + (p.mrp > p.price ? `<span class="old">${rs(p.mrp)}</span><span class="off">${pct}% off</span>` : "");
    return `<article class="p" data-s="${esc((label(p) + " " + p.id).toLowerCase())}">
      <button class="ph" data-img="${esc(p.image)}" aria-label="View ${esc(label(p))} larger"><img loading="lazy" src="${esc(p.image)}" alt="${esc(label(p))}"></button>
      <div class="pb">
        <h3>${esc(label(p))}</h3><small>${esc(p.pack)}</small>
        <div class="price">${priceHtml}</div>
        <div class="qty${ok ? "" : " off"}">
          <button aria-label="Remove one" data-d="-1" data-id="${esc(p.id)}">−</button>
          <input aria-label="Quantity of ${esc(label(p))}" id="q-${esc(p.id)}" type="number" min="0" value="${cart[p.id] || 0}" data-id="${esc(p.id)}">
          <button aria-label="Add one" data-d="1" data-id="${esc(p.id)}">+</button>
        </div></div></article>`;
  }).join("");
  filter();
}

function filter(){
  const s = $("search").value.trim().toLowerCase(); let n = 0;
  document.querySelectorAll("#grid .p").forEach(el => { const m = !s || el.dataset.s.includes(s); el.classList.toggle("gone", !m); if (m) n++; });
  $("shown").textContent = n + " items";
}
$("search").addEventListener("input", filter);

function setQty(id, v){
  v = Math.max(0, Math.min(999, parseInt(v) || 0));
  cart[id] = v; const el = $("q-" + id); if (el) el.value = v; updateBar();
}
function totals(){
  let mrp = 0, pay = 0, n = 0;
  items().forEach(p => { const q = cart[p.id]; mrp += p.mrp * q; pay += p.price * q; n += q; });
  return {mrp, pay, n, save: mrp - pay};
}
function updateBar(){
  const t = totals();
  $("count").textContent = t.n + (t.n === 1 ? " item" : " items");
  $("barTotal").textContent = rs(t.pay) + (t.save ? " · you save " + rs(t.save) : "");
  $("review").disabled = t.n === 0;
}

$("grid").addEventListener("click", e => {
  const ph = e.target.closest(".ph");
  if (ph){ $("lb").querySelector("img").src = ph.dataset.img; $("lb").classList.remove("hide"); return; }
  const b = e.target.closest(".qty button"); if (!b) return;
  setQty(b.dataset.id, (cart[b.dataset.id] || 0) + +b.dataset.d);
});
$("grid").addEventListener("change", e => { if (e.target.dataset.id) setQty(e.target.dataset.id, e.target.value); });
$("lb").onclick = () => $("lb").classList.add("hide");
document.addEventListener("keydown", e => { if (e.key === "Escape") $("lb").classList.add("hide"); });

function show(page){
  ["shop","summary","done"].forEach(s => $(s).classList.toggle("hide", s !== page));
  $("bar").classList.toggle("hide", page !== "shop");
  window.scrollTo(0, 0);
}

$("review").onclick = () => {
  const t = totals();
  $("rows").innerHTML = items().map(p => `<tr><td>${esc(label(p))}</td><td class="r">${rs(p.price)}</td><td class="r">${cart[p.id]}</td><td class="r">${rs(p.price * cart[p.id])}</td></tr>`).join("");
  $("foot").innerHTML =
    `<tr class="tot"><td colspan="3" class="r">Total at real price</td><td class="r old">${rs(t.mrp)}</td></tr>
     <tr class="tot save"><td colspan="3" class="r">You save</td><td class="r">${rs(t.save)}</td></tr>
     <tr class="tot"><td colspan="3" class="r">Amount to pay</td><td class="r" style="font-size:20px">${rs(t.pay)}</td></tr>`;
  $("note").textContent = URL_SET ? "" : "Test mode: no Google Sheet link set yet, so the order will be saved in this browser and downloaded as a CSV file.";
  $("err").textContent = "";
  show("summary");
};
$("back").onclick = () => show("shop");
$("again").onclick = () => { for (const k in cart) cart[k] = 0; renderGrid(); updateBar(); ["name","phone","addr"].forEach(i => $(i).value = ""); show("shop"); };

$("submit").onclick = async () => {
  const name = $("name").value.trim(), phone = $("phone").value.trim(), addr = $("addr").value.trim();
  if (!name) return $("err").textContent = "Enter your name.";
  if (!/^[6-9]\d{9}$/.test(phone)) return $("err").textContent = "Enter a valid 10-digit mobile number.";
  if (addr.length < 8) return $("err").textContent = "Enter your full delivery address.";

  const t = totals();
  const order = {
    orderId: "SC" + Date.now().toString().slice(-8),
    time: new Date().toLocaleString("en-IN"),
    name, phone, address: addr,
    items: items().map(p => `${label(p)} [${p.id}] x ${cart[p.id]} @ ${p.price}`).join("\n"),
    total: t.pay, saved: t.save
  };

  const btn = $("submit"); btn.disabled = true; btn.textContent = "Placing order…"; $("err").textContent = "";
  try {
    if (URL_SET) {
      await fetch(SHEET_URL, {method:"POST", mode:"no-cors", headers:{"Content-Type":"text/plain;charset=utf-8"}, body: JSON.stringify(order)});
    } else {
      saveLocally(order);
    }
    $("oid").textContent = order.orderId; $("ph").textContent = phone; show("done");
  } catch (err) {
    $("err").textContent = "Could not place the order. Check your internet and try again.";
  }
  btn.disabled = false; btn.textContent = "Place order";
};

function saveLocally(o){
  const row = [o.time,o.orderId,o.name,o.phone,o.address,o.items,o.total].map(v => '"' + String(v).replace(/"/g,'""') + '"').join(",");
  const csv = "Time,Order ID,Name,Phone,Address,Items,Total\n" + row;
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["\ufeff" + csv], {type:"text/csv"}));
  a.download = o.orderId + ".csv"; a.click();
}

updateBar(); load();
</script>
</body>
</html>
